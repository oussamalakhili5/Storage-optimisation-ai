services:

  backend:
    build: ./backend
    container_name: storage_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    environment:
      DATABASE_URL: postgresql+psycopg://admin:admin123@postgres:5432/storage_db
      HDFS_URL: http://namenode:9870
      HDFS_FILE_PATH: /data/storage/storage_data.csv
      HDFS_USER: root

    depends_on:
      - postgres
      - namenode
      - datanode

  postgres:
    image: postgres:16
    container_name: storage_postgres

    restart: always

    environment:
      POSTGRES_DB: storage_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop_namenode

    restart: always

    ports:
      - "9870:9870"
      - "9000:9000"

    environment:
      - CLUSTER_NAME=storage-hadoop-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000

    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./backend/app/data:/data

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop_datanode

    restart: always

    depends_on:
      - namenode

    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SERVICE_PRECONDITION=namenode:9870

    volumes:
      - hadoop_datanode:/hadoop/dfs/data

volumes:
  postgres_data:
  hadoop_namenode:
  hadoop_datanode:
