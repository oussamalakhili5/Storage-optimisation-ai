services:

  backend:
    build: ./backend
    container_name: storage_backend

    ports:
      - "${BACKEND_PORT}:8000"

    volumes:
      - ./backend:/app

    env_file:
      - .env

    environment:
      MONGO_URI: "mongodb://mongodb:27017/${MONGO_DB}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY}"
      FLASK_ENV: "${FLASK_ENV}"
      FLASK_DEBUG: "${FLASK_DEBUG}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      JWT_ACCESS_TOKEN_EXPIRES: "${JWT_ACCESS_TOKEN_EXPIRES}"
      HDFS_URL: "http://${HDFS_NAMENODE_HOST}:${HDFS_NAMENODE_PORT}"
      HDFS_FILE_PATH: "${HDFS_FILE_PATH}"
      HDFS_USER: "${HDFS_USER}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
      SPARK_MASTER_URL: "spark://spark-master:7077"

    depends_on:
      mongodb:
        condition: service_started
      namenode:
        condition: service_started
      datanode:
        condition: service_started
      spark-master:
        condition: service_started

  mongodb:
    image: mongo:7.0
    container_name: storage_mongodb

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    environment:
      MONGO_INITDB_DATABASE: "${MONGO_DB}"

  spark-master:
    image: bitnami/spark:latest
    container_name: spark_master

    restart: always

    ports:
      - "8080:8080"
      - "7077:7077"

    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop_namenode

    restart: always

    env_file:
      - .env

    ports:
      - "${HDFS_NAMENODE_PORT}:9870"
      - "${HDFS_NAMENODE_RPC_PORT}:9000"

    environment:
      - CLUSTER_NAME=${HADOOP_CLUSTER_NAME}
      - CORE_CONF_fs_defaultFS=hdfs://${HDFS_NAMENODE_HOST}:${HDFS_NAMENODE_RPC_PORT}

    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./backend/app/data:/data

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop_datanode

    restart: always

    depends_on:
      - namenode

    environment:
      - CORE_CONF_fs_defaultFS=hdfs://${HDFS_NAMENODE_HOST}:${HDFS_NAMENODE_RPC_PORT}
      - SERVICE_PRECONDITION=${HDFS_NAMENODE_HOST}:${HDFS_NAMENODE_PORT}

    volumes:
      - hadoop_datanode:/hadoop/dfs/data

volumes:
  mongo_data:
  hadoop_namenode:
  hadoop_datanode:
