services:

  backend:
    build: ./backend
    container_name: storage_backend

    ports:
      - "${BACKEND_PORT}:8000"

    volumes:
      - ./backend:/app

    env_file:
      - .env

    environment:
      DATABASE_URL: "${DATABASE_URL}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY}"
      FLASK_ENV: "${FLASK_ENV}"
      FLASK_DEBUG: "${FLASK_DEBUG}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      JWT_ACCESS_TOKEN_EXPIRES: "${JWT_ACCESS_TOKEN_EXPIRES}"
      HDFS_URL: "http://${HDFS_NAMENODE_HOST}:${HDFS_NAMENODE_PORT}"
      HDFS_FILE_PATH: "${HDFS_FILE_PATH}"
      HDFS_USER: "${HDFS_USER}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"

    depends_on:
      postgres:
        condition: service_healthy
      namenode:
        condition: service_started
      datanode:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: storage_postgres

    restart: always

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop_namenode

    restart: always

    env_file:
      - .env

    ports:
      - "${HDFS_NAMENODE_PORT}:9870"
      - "${HDFS_NAMENODE_RPC_PORT}:9000"

    environment:
      - CLUSTER_NAME=${HADOOP_CLUSTER_NAME}
      - CORE_CONF_fs_defaultFS=hdfs://${HDFS_NAMENODE_HOST}:${HDFS_NAMENODE_RPC_PORT}

    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./backend/app/data:/data

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop_datanode

    restart: always

    depends_on:
      - namenode

    environment:
      - CORE_CONF_fs_defaultFS=hdfs://${HDFS_NAMENODE_HOST}:${HDFS_NAMENODE_RPC_PORT}
      - SERVICE_PRECONDITION=${HDFS_NAMENODE_HOST}:${HDFS_NAMENODE_PORT}

    volumes:
      - hadoop_datanode:/hadoop/dfs/data

volumes:
  postgres_data:
  hadoop_namenode:
  hadoop_datanode:
